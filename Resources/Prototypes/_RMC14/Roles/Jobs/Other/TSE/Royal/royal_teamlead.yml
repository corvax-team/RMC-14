    - SlimePerson # CCM14
    - Vox # CCM14
    - Vulpkanin # CCM14
    - Avali # CCM14
    - Feroxi # CCM14
    - Felinid # CCM14
    - Dwarf # CCM14
    - Rodentia # CCM14
    - Skrell # CCM14
  components:
  - type: GhostRole
    name: rmc-ghost-name-rcm-teamlead
    description: rmc-ghost-role-information-rcm-description
