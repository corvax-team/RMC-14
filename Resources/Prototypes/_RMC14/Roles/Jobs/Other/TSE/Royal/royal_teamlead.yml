  supervisors: cm-job-supervisors-royal-lieutenant
  spawnMenuRoleName: RCM Team Leader
  special:
  - !type:AddComponentSpecial
    components:
    - type: NpcFactionMember
      factions:
      - RoyalMarines
      - TSE
    - type: Language # CCM14
      spokenLanguages: # CCM14
      - Japanese # CCM14
      - English # CCM14
      understoodLanguages: # CCM14
      - Japanese # CCM14
      - English # CCM14
      currentLanguage: Japanese # CCM14
      defaultLanguage: Japanese # CCM14
