      preset: RMCSkillPresetRoyalTeamLeader
    - type: MarineOrders
    - type: RMCPointing
    - type: CommandAccent
    - type: ViewIntelObjectives
    - type: SquadLeader
      icon: 
        sprite: _RMC14/Interface/cm_job_icons.rsi
        state: rmc_teamleader
    - type: RMCTrackable
    - type: JobPrefix
      prefix: rmc-job-prefix-rcm-teamlead
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: rmc_teamleader
      background:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: background_twe
  hidden: true

- type: entity
