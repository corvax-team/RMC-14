- type: entity
  parent:
  - CMXenoDeveloped
  - CMXenoTail
  - CMXenoFlammable
  - RMCXenoSpeechSounds
  - CCMXenoEmoteSounds #CCM Adding xeno emotion
  id: CMXenoRunner
  name: Runner
  description: A small red alien that looks like it could run fairly quickly...
  components:
  - type: Tag
    tags:
      - Runner #CCM Adding a xenomorph tag
  - type: GhostRole
    name: cm-job-name-xeno-runner
  - type: Sprite
    sprite: _RMC14/Mobs/Xenonids/Runner/runner.rsi
  - type: MobState
    allowedStates:
    - Alive
    - Critical
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      330: Critical
      430: Dead
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 185
        mask:
        - Impassable
        - HighImpassable
        - LowImpassable
        layer:
        - MobLayer
  - type: Xeno
    role: CMXenoRunner
    actionIds:
    - ActionXenoRest
    - ActionXenoRegurgitate
    - ActionXenoWatch
    - ActionXenoTailSlam
    - ActionXenoHide
    - ActionXenoLeap
    - ActionXenoBoneChips
    - ActionXenoZoom
    - ActionXenoDevolve
    tier: 1
    hudOffset: 0,0.63
    unlockAt: 300 # 5 minutes
  - type: XenoDevolve
    devolvesTo:
    - CMXenoLarva
  - type: XenoBoneChips
  - type: XenoTailSlam
    power: 0
    stunTime: 100
    tailDamage:
      groups:
        Brute: 35
  - type: XenoDevour
  - type: XenoHide
  - type: SlowOnPull
    multiplier: 0.86
  - type: XenoLeap
    delay: 0
    knockdownTime: 2
    leapSound: /Audio/_RMC14/Xeno/alien_pounce.ogg
  - type: XenoPlasma
    plasma: 0
    maxPlasma: 0
    plasmaRegenOnWeeds: 0
  - type: CMArmor
    explosionArmor: 10
  - type: XenoEvolution
    max: 300
    evolvesTo:
    - CMXenoLurker
    - CCMXenoRouny # CCM Rouny
  - type: XenoZoom
  - type: MeleeWeapon
    attackRate: 1.4
    damage:
      groups:
        Brute: 22.5
  - type: Tackle # min: 4, max: 5
    threshold: 5
    stun: 8
    chance: 0.40
  - type: MovementSpeedModifier
    baseWalkSpeed: 5.55
    baseSprintSpeed: 10
  - type: RMCXenoDamageVisuals
    prefix: runner
