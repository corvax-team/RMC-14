- type: entity
  id: ActionFpvDroneExplosive
  name: "Explosive Detonation"
  description: "Detonate the FPV Drone's explosive charge."
  noSpawn: true
  components:
  - type: Action
    itemIconStyle: NoItem
    icon:
        sprite: _CM/Actions/drone.rsi
        state: blast
  - type: InstantAction
    useDelay: 0
    priority: 7
    event: !type:FpvDroneExplosiveEvent
    checkCanInteract: false

