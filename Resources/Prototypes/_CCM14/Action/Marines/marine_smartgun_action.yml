- type: entity
  parent: ActionMarineToggleable
  id: CCMActionToggleFrontline
  name: Toggle Frontline Mode
  description: Prevents firing through allied IFF signatures and modifies damage falloff for suppressive fire.
  components:
  - type: Action
    icon:
      sprite: _CCM14/Actions/marine_smart_gun_actions.rsi
      state: frontline
    useDelay: 0.25
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:GunToggleFrontlineActionEvent
