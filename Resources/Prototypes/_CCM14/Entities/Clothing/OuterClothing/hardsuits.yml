# РХБЗЗ
- type: entity
  parent: RMCBaseArmor
  id: CCMHardsuitCBRNZ
  name: CBRN hardsuit Mk. 35-H
  description: A specialized modification of the CMC's Mk. 35 hardsuit. Used by the CBRN marine detachments. Made more for a battle with a walking dead and giant space insects then hostile gunmen.
  components:
  - type: Sprite
    sprite: _CCM14/Objects/Clothing/OuterClothing/Armor/Hardsuits/cbrnz.rsi
  - type: Clothing
    sprite: _CCM14/Objects/Clothing/OuterClothing/Armor/Hardsuits/cbrnz.rsi
    equipDelay: 2
    unequipDelay: 2
  - type: ToggleableClothing
    clothingPrototype: CCMArmorHelmetHardsuitCBRNZ
  - type: Tag
    tags:
    - Hardsuit
  - type: CMArmor
    bio: 75
    melee: 30
    bullet: 15
    explosionArmor: 50
  - type: ClothingSpeedModifier
    walkModifier: 0.64
    sprintModifier: 0.64
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.2
  - type: CMHardArmor
  - type: RMCBulkyArmor
  - type: RMCMagneticArmor
  - type: RMCArmorSpeedTier
    speedTier: heavy

- type: entity
  parent: [ArmorHelmetPMC, RMCMarineHelmetWithLightBase]
  id: CCMArmorHelmetHardsuitCBRNZ
  name: CBRNZ Mk. 35-H pressure helmet
  description: 
  components:
  - type: Sprite
    sprite: _CCM14/Objects/Clothing/Head/Helmets/Hardsuits/cbrnz.rsi
  - type: Clothing
    sprite: _CCM14/Objects/Clothing/Head/Helmets/Hardsuits/cbrnz.rsi
    clothingVisuals:
      head:
      - state: equipped-HELMET
  - type: CMArmor
    melee: 15
    bullet: 10
    explosionArmor: 20
    bio: 100
  - type: HideLayerClothing
    slots:
    - Hair
    - HeadTop
    - HeadSide
    - Snout
    - FacialHair
  - type: PointLight
    color: "#68ff79"
  - type: ClothingGrantComponents
    components:
    - type: RMCImmuneToIgnition
    - type: RMCImmuneToFireTileDamage
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.2

# Рейдеры ККМП
- type: entity
  parent: RMCArmorM4PMCNoLight
  id: CCMArmorRaider
  name: marine raider hardsuit
  description: A modernized combat hardsuit with a stealth field generator and an exoskeleton connected to it. Used by Marine Raiders.
  components:
  - type: Sprite
    sprite: _CCM14/Objects/Clothing/OuterClothing/Armor/marsoc.rsi
  - type: CMArmor
    melee: 35
    bullet: 35
    bio: 20
    explosionArmor: 40
  - type: RMCArmorSpeedTier
    speedTier: light
  - type: ClothingSpeedModifier
    walkModifier: 1.1
    sprintModifier: 1.1
  - type: Storage
    grid:
    - 0,0,7,1 # 4 slots
    maxItemSize: Small
  - type: ItemCamouflage
    camouflageVariations: { }
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.3

- type: entity
  parent: CCMArmorRaider
  id: CCMArmorRaiderXM40
  suffix: XM40 HEAP, Filled
  components:
  - type: StorageFill
    contents:
    - id: RMCMagazineRifleXM40HEAP
      amount: 4

- type: entity
  parent: [ RMCHelmetBase, ShowMedicalIcons ]
  id: CCMHelmetRaider
  name: marine raider helmet
  description: Sunglasses wired up with the best nano-tech the UNMC can muster out on the frontier. Displays information about any person you decree worthy of your gaze.
  components:
  - type: ShowMindShieldIcons
  - type: ShowCriminalRecordIcons
  - type: FlashImmunity
  - type: RMCEarProtection
  - type: Item
    storedRotation: 0
  - type: Sprite
    sprite: _CCM14/Objects/Clothing/Head/Helmets/marsoc.rsi
  - type: Clothing
    sprite: _CCM14/Objects/Clothing/Head/Helmets/marsoc.rsi
  - type: CMArmor
    melee: 25
    bullet: 30
    bio: 25
  - type: Appearance
  - type: HideLayerClothing
    slots:
    - Hair
    - HeadTop
    - HeadSide
    - Snout
  - type: ClothingGrantComponents
    components:
    - type: NightVision
      alert: XenoNightVision