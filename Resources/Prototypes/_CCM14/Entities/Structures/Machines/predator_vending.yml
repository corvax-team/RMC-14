- type: entity
  parent: ColMarTechCargo
  id: CCMPredatorFabricatorMelee
  name: predator melee weapon fabricator
  description: High-Tech technology for crafting a high-tech weapon for Hunting.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/requisitions_wall/guns.rsi
  - type: CMAutomatedVendor
    baseSprite:
      sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/requisitions_wall/guns.rsi
      state: base
    animationSprite:
      sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/requisitions_wall/guns.rsi
      state: vend
    sound:
      path: /Audio/Machines/circuitprinter.ogg
      params:
        maxDistance: 2
        volume: -4
    sections:
    - name: Лёгкое одно-ручное оружие
      choices: { CCMPredatorMeleeWeapon: 1 }
      entries:
      - id: CCMPredatorCeremonialDagger
        amount: 1
      - id: CCMPredatorChainWhip
        amount: 1
      - id: CCMPredatorClanSword
        amount: 1
    - name: Тяжёлое одно-ручное оружие
      choices: { CCMPredatorMeleeWeapon: 1 }
      entries:
      - id: CCMPredatorSeveringSword
        amount: 1
      - id: CCMPredatorWarScythe
        amount: 1
      - id: CCMPredatorDoubleScythe
        amount: 1
      - id: CCMPredatorCruelStaff
        amount: 1
      - id: CCMPredatorCombiStick
        amount: 1
    - name: Лёгкое двух-ручное оружие
      choices: { CCMPredatorMeleeWeapon: 1 }
      entries:
      - id: CCMPredatorWarGlaive
        amount: 1
    - name: Тяжёлое двух-ручное оружие
      choices: { CCMPredatorMeleeWeapon: 1 }
      entries:
      - id: CCMPredatorLongAxe
        amount: 1
    - name: Метательное оружие
      choices: { CCMPredatorThrowingWeapon: 4 }
      entries:
      - id: CCMPredatorThrowingHarpoon
      - id: CCMPredatorHeavyThrowingSpear
        amount: 2
    - name: Стреляющее оружие
      choices: { CMUYautjaRanged: 1 }
      entries:
      - id: CMUYautjaSpikeLauncher
        amount: 1
      - id: CMUYautjaPlasmaRifle
        amount: 1
      - id: CMUYautjaPlasmaPistol
        amount: 1

