- type: entity
  parent: BaseStructureComputer
  id: CMFPVDroneControl
  name: FPV Drone Control Console
  description: Control your FPV drone and see the world through its eyes!
  placement:
    mode: SnapgridCenter  
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmash
  - type: Construction
    graph: Computer
    node: computer
    containers:
      - board
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: ActivatableUIRequiresPower
  - type: Sprite
    sprite: _CM/Structures/Machines/Computer/Drone.rsi
    state: Drone
  - type: Computer
    board: ComputerMassMediaCircuitboard
  - type: DeviceNetworkRequiresPower
  - type: FpvDroneControl
    observerId: FpvDroneObserver
  - type: AccessReader
    access: [[ "PilotRaptor" ]]
  - type: Transform
    anchored: true
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
  - type: LitOnPowered
  - type: PointLight
    radius: 1.5
    energy: 1.6
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    offset: "0, 0.4" # shine from the top, not bottom of the computer
    castShadows: false
  - type: EmitSoundOnUIOpen
    sound:
      collection: Keyboard
      params:
        volume: -1
  - type: ContainerContainer
    containers:
      board: !type:Container
        ents: []
  - type: LightningTarget
    priority: 1