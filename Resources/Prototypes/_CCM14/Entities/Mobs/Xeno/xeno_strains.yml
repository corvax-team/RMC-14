# // CCM Xeno Strain - Boxer Warrior
- type: entity
  parent: CMXenoWarrior
  id: CCMXenoWarriorBoxer
  suffix: Boxer
  components:
  - type: Sprite
    sprite: _RMC14/Mobs/Xenonids/Warrior/boxer.rsi
  - type: XenoStrain
    name: ccm-xeno-boxer-name
    description: ccm-xeno-boxer-description
    popup: ccm-xeno-boxer-popup
  - type: Xeno
    actionIds:
    - ActionXenoRest
    - ActionXenoRegurgitate
    - ActionXenoWatch
    - ActionXenoTailStab
    - ActionXenoPunch
    - CCMActionXenoBoxerAdvance
    - CCMActionXenoFuryOfThousandPunches
    - ActionXenoDevolve
  - type: XenoLeap
    strength: 50
    delay: 0
    range: 2
    moveDelayTime: 0
    knockdownTime: 0
    leapSound: /Audio/_RMC14/Xeno/alien_claw_block.ogg
    hitEffect: CMEffectPunch
    targetJitterTime: 1
    targetCameraShakeStrength: 1
    damage:
      groups:
        Brute: 20
  - type: XenoPunch
    effect: RMCEffectSlam
    damage:
      types:
        Blunt: 35
  - type: XenoRage
    armorPerRage: 0
    speedBuffPerRage: 0
    attackSpeedPerRage: 0.1
    maxRage: 20 
    healAmount: 0
  - type: XenoEviscerate
    hitSound:
      collection: Punch
    stunTime: 0
    maxLifeSteal: 0
    lifeStealPerMarine: 0
    damageAtRageLevels:
    - groups:
        Brute: 8
    - groups:
        Brute: 16
    - groups:
        Brute: 24
    - groups:
        Brute: 32
    - groups:
        Brute: 40
# 5- rage stacks ↑ // 6+ rage stacks ↓
    - groups:
        Brute: 48
    - groups:
        Brute: 56
    - groups:
        Brute: 64
    - groups:
        Brute: 72
    - groups:
        Brute: 80
# 10- rage stacks ↑ // 11+ rage stacks ↓
    - groups:
        Brute: 88
    - groups:
        Brute: 96
    - groups:
        Brute: 104
    - groups:
        Brute: 112
    - groups:
        Brute: 120
# 15- rage stacks ↑ // 16+ rage stacks ↓
    - groups:
        Brute: 128
    - groups:
        Brute: 136
    - groups:
        Brute: 144
    - groups:
        Brute: 152
    - groups:
        Brute: 160
    rangeAtRageLevels: [1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5]
    windupReductionAtRageLevels: [0, -0.1, -0.1, -0.2, -0.2, -0.3, -0.3, -0.4, -0.4, -0.5, -0.5, -0.6, -0.6, -0.7, -0.7, -0.8, -0.8, -0.9, -0.9, -1] # + 0.1 every 2 rage stacks
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    animation: CCMWeaponArcXenoPunch
    damage:
      groups:
        Brute: 20
  - type: XenoEvolution
    max: 500
    evolvesTo:
    - RMCXenoCrusher
    - CMXenoPraetorian
    strains: []
  - type: XenoHidden
  - type: XenoLifesteal
    maxHeal: 30
    minHeal: 20

# // CCM Xeno Punch Attack Effect
- type: entity
  parent: [WeaponArcClaw, RMCBaseEffect]
  id: CCMWeaponArcXenoPunch
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.4
  - type: Sprite
    sprite: _RMC14/Effects/attacks.rsi
    state: punch
    noRot: true
# // CCM Xeno Punch Attack Effect
# // CCM Xeno Strain - Boxer Warrior

# // CCM Xeno Strain - Melee & Ranger Sentinels
- type: entity
  parent: CMXenoSentinel
  id: CCMXenoMeleeSentinel
  components:
  - type: Sprite
    sprite: _RMC14/Mobs/Xenonids/Sentinel/melee.rsi
  - type: XenoStrain
    name: ccm-xeno-meleesent-name
    description: ccm-xeno-meleesent-description
    popup: ccm-xeno-meleesent-popup
  - type: Xeno
    actionIds:
    - ActionXenoRest
    - ActionXenoRegurgitate
    - ActionXenoWatch
    - ActionXenoTailStab
    - ActionXenoAcidWeak
    - ActionXenoPunch
    - CCMActionXenoLightNeuroEmpower
    - CCMActionXenoGreaterParalyzingSlash
    - ActionXenoDevolve
  - type: MeleeWeapon
    damage:
      groups:
        Brute: 27.5
  - type: XenoTailStab
    tailDamage:
      groups:
        Brute: 35
  - type: XenoPunch
    range: 3
    damage:
      types:
        Blunt: 27.5
  - type: XenoParalyzingSlash
    stunDelay: 1
    stunDuration: 2
  - type: XenoCripplingStrike
    activateText: rmc-xeno-apprehend-activate
    deactivateText: rmc-xeno-apprehend-deactivate
    expireText: rmc-xeno-apprehend-expire
    removeOnHit: true
    preventTackle: true
    resetMeleeCooldown: true
    auraColor: "#9ACD32FF"
    damageMult: 1
    speed: 1.2
  - type: CMArmor
    xenoArmor: 15
    explosionArmor: 35
  - type: XenoEvolution
    canEvolveWithoutGranter: true
    max: 200
    evolvesTo:
    - CMXenoSpitter
    evolvesToWithoutPoints:
    - CMXenoQueen
    strains: []
  - type: XenoHidden

- type: entity
  parent: CMXenoSentinel
  id: CCMXenoRangerSentinel
  components:
  - type: Sprite
    sprite: _RMC14/Mobs/Xenonids/Sentinel/ranger.rsi
  - type: XenoStrain
    name: ccm-xeno-rangersent-name
    description: ccm-xeno-rangersent-description
    popup: ccm-xeno-rangersent-popup
  - type: Xeno
    actionIds:
    - ActionXenoRest
    - ActionXenoRegurgitate
    - ActionXenoWatch
    - ActionXenoTailStab
    - ActionXenoAcidWeak
    - ActionXenoSlowingSpit
    - ActionXenoScatteredSpit
    - ActionXenoSprayAcid
    - ActionXenoDevolve
  - type: XenoSlowingSpit
    projectileId: CCMXenoGreatSlowingSpitProjectile
  - type: XenoScatteredSpit
    maxDeviation: 60
    maxProjectiles: 12
    projectileId: CCMXenoGreatScatteredSpitProjectile
  - type: XenoSprayAcid
    acid: CCMXenoAcidSprayRanger
    barricadeDamage:
      types:
        Heat: 5
  - type: XenoEvolution
    canEvolveWithoutGranter: true
    max: 200
    evolvesTo:
    - CMXenoSpitter
    evolvesToWithoutPoints:
    - CMXenoQueen
    strains: []
  - type: MobThresholds
    thresholds:
      0: Alive
      380: Critical
      480: Dead
  - type: XenoHidden
# // CCM Xeno Strain - Melee & Ranger Sentinels

# // CCM Xeno Strain - Sniper Spitter
- type: entity
  parent: CMXenoSpitter
  id: CCMXenoSniperSpitter
  components:
  - type: Sprite
    sprite: _RMC14/Mobs/Xenonids/Spitter/sniper.rsi
  - type: XenoStrain
    name: ccm-xeno-sniper-name
    description: ccm-xeno-sniper-description
    popup: ccm-xeno-sniper-popup
  - type: Xeno
    actionIds:
    - ActionXenoRest
    - ActionXenoRegurgitate
    - ActionXenoWatch
    - ActionXenoTailStabCorrosive
    - ActionXenoAcidNormal
    - CCMActionXenoSniperSnipe
    - ActionXenoZoom
    - ActionXenoSprayAcid
    - CCMActionXenoSniperWalker
    - ActionXenoDevolve
  - type: XenoSpit
    plasmaCost: 300
    projectileId: CCMXenoSniperSpitProjectile
    speed: 33
  - type: XenoResinWalker
    plasmaCost: 100
    speedMultiplier: 5
  - type: XenoSprayAcid
    acid: CCMXenoAcidSpraySniper
    barricadeDamage:
      types:
        Heat: 5
  - type: MovementSpeedModifier
    baseWalkSpeed: 1
    baseSprintSpeed: 1.4
  - type: XenoZoom
    zoom: 2, 2
    offsetLength: 3
    speed: 0.8
    doAfter: 0.5
  - type: XenoEvolution
    max: 500
    evolvesTo:
    - CMXenoBoiler
    - CMXenoPraetorian
    strains: []
  - type: MobThresholds
    thresholds:
      0: Alive
      350: Critical
      450: Dead
  - type: XenoHidden
# // CCM Xeno Strain - Sniper Spitter
