- type: entity
  parent: RMCXenoQueenBase
  id: CCMXenoFierceQueen
  suffix: Fierce
  components:
  - type: RMCActionOrder
    id: CMXenoQueen
  - type: Sprite
    sprite: _CCM14/Mobs/Xenonids/Queen/queen.rsi
    layers:
    - map: [ "enum.XenoVisualLayers.Base" ]
      state: alive
    - map: [ "enum.XenoVisualLayers.Ovipositor" ]
      sprite: _CCM14/Mobs/Xenonids/Queen/ovipositor.rsi
    - map: [ "enum.RMCDamageVisualLayers.Base" ]
      visible: false
    - map: [ "enum.XenoInhandVisualLayers.Left" ]
      visible: false
    - map: [ "enum.XenoInhandVisualLayers.Right" ]
      visible: false
    - map: [ "enum.RMCShieldVisuals.Base" ]
      sprite: _RMC14/Effects/xeno_shields.rsi
      visible: false
  - type: MobThresholds
    thresholds:
      0: Alive
      1500: Critical
      1600: Dead
  - type: Xeno
    role: CMXenoQueen
    spawnAtLeaderPoint: true
    actionIds:
    - ActionXenoRest
    - ActionXenoRegurgitate
    - ActionXenoWatch
    - ActionXenoTailStab
    - ActionXenoOrderConstruction
    - ActionXenoAcidNormal
    - ActionXenoPheromones
    - ActionXenoWordQueen
    - ActionXenoPsychicWhisper
    - ActionXenoPsychicRadiance
    - ActionXenoGiveOrder
    - ActionXenoGut
    - ActionXenoPlantWeeds
    - ActionXenoGrowOvipositor
    - ActionXenoManageHive
#    - ActionXenoRoyalJelly
  - type: XenoStrain
    name: ccm-xeno-fierce-name
    description: ccm-xeno-fierce-description
    popup: ccm-xeno-fierce-popup
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.7
    baseSprintSpeed: 3.3
  - type: MeleeWeapon
    damage:
      groups:
        Brute: 55
  - type: XenoTailStab
    tailDamage:
      groups:
        Brute: 60
  - type: XenoBrutalize
    damage:
      types:
        Blunt: 20
  - type: StunHostilesOnStep
    damage:
      groups:
        Brute: 20
  - type: VehicleDamageMultiplier
    multiplier: 4
  - type: CMArmor
    xenoArmor: 35
    explosionArmor: 125
  - type: XenoPlasma
    plasma: 1200
    maxPlasma: 1200
    plasmaRegenOnWeeds: 5
    plasmaTransferDelay: 0
