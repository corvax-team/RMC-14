- type: entity
  parent: BaseItem
  id: FpvDroneFolded
  name: fpv drone
  description: A compact foldable FPV drone.
  suffix: folded
  components:
  - type: Sprite
    sprite: _CCM14/Mobs/Silicon/fpv.rsi
    state: marker
  - type: Item
    size: Normal
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 10
        mask:
        - ItemMask
  - type: FpvDroneFoldable
    unfoldEntity: FpvDroneObserver
    unfoldDelay: 1.5

- type: entity
  parent: [ BaseMob, FlyingMobBase ]
  id: FpvDroneObserver
  name: fpv drone
  description: A deployed FPV drone.
  noSpawn: true
  components:
  - type: Sprite
    sprite: _CCM14/Mobs/Silicon/fpv.rsi
    state: marker
  - type: Input
    context: "aghost"
  - type: MovementIgnoreGravity
    globalReceive: true
  - type: MovementSpeedModifier
    baseSprintSpeed: 8
    baseWalkSpeed: 4
  - type: Visibility
    layer: 1
  - type: FpvDroneObserver
  - type: FpvDroneExplosive
    totalIntensity: 250
    radius: 6
    maxTileIntensity: 15
    explodeActionId: ActionFpvDroneExplosive
  - type: Explosive
    explosionType: RMC
  - type: CMExplosionEffect
  - type: RMCScorchEffect
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Girder:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]