- type: entity
  parent: Screwdriver
  id: CCMScrewdriver
  components:
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        screwdriver: Rainbow
  - type: Sprite
    sprite: _CCM14/Objects/Tools/screwdriver.rsi
    layers:
    - state: screwdriver
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: screwdriver-screwybits
  - type: Item
    size: Tiny
    sprite: _CCM14/Objects/Tools/screwdriver.rsi
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_RMC14/Handling/screwdriver_pickup.ogg

- type: entity
  parent: Wirecutter
  id: CCMWirecutter
  components:
  - type: Sprite
    sprite: _CCM14/Objects/Tools/wirecutters.rsi
    layers:
    - state: cutters
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: cutters-cutty-thingy
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        cutters: Rainbow
  - type: Item
    size: Small
    sprite: _CCM14/Objects/Tools/wirecutters.rsi
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_RMC14/Handling/wirecutter_pickup.ogg

- type: entity
  parent: Wrench
  id: CCMWrench
  components:
  - type: Sprite
    sprite: _CCM14/Objects/Tools/wrench.rsi
    state: icon
  - type: Item
    size: Small
    sprite: _CCM14/Objects/Tools/wrench.rsi
    storedRotation: 90
    storedSprite:
      sprite: _CCM14/Objects/Tools/wrench.rsi
      state: icon
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_RMC14/Handling/wrench_pickup.ogg

- type: entity
  parent: Crowbar
  id: CCMCrowbar
  components:
  - type: Sprite
    sprite: _CCM14/Objects/Tools/crowbar.rsi
    state: icon
  - type: Item
    size: Small
    sprite: _CCM14/Objects/Tools/crowbar.rsi
    storedSprite:
      sprite: _CCM14/Objects/Tools/crowbar.rsi
      state: icon
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_RMC14/Handling/crowbar_pickup.ogg

- type: entity
  parent: CCMCrowbar
  id: CCMCrowbarRed
  name: emergency crowbar
  components:
  - type: Tag
    tags:
    - Crowbar
    - CrowbarRed
  - type: Sprite
    state: red-icon
  - type: Item
    heldPrefix: red