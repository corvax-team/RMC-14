- type: entity
  parent: BaseItem
  id: CCMBaseMechEquipment
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Specific/Mech/mecha_equipment.rsi
  - type: Item
    sprite: Objects/Specific/Mech/mecha_equipment.rsi
    size: Ginormous
  - type: CCMMechEquipment

- type: entity
  id: CCMBaseMechWeaponRange
  parent: CCMBaseMechEquipment
  abstract: true
  components:
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: Appearance
  - type: StaticPrice
    price: 1
  - type: Item
    size: Ginormous
  - type: MultiHandedItem
  - type: ClothingSpeedModifier
    walkModifier: 0.5
    sprintModifier: 0.5
  - type: HeldSpeedModifier

- type: entity
  id: CCMWeaponMechCombatAssaultRifle
  name: Mounted Assault Rifle
  description: Mounted assault rifle, used for combat exosuits
  suffix: Mech Weapon, Assault Rifle
  parent: [ CCMBaseMechWeaponRange ]
  components:
  - type: Sprite
    sprite: _CCM14/Objects/Mech/weapons.rsi
    state: assaultrifle
  - type: Battery
    maxCharge: 300
    startingCharge: 300
  - type: Gun
    fireRate: 4.5
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_m4spr.ogg
  - type: ProjectileBatteryAmmoProvider
    proto: CMCartridgeRifle10x24mm
    fireCost: 20
  - type: Appearance
  - type: AmmoCounter
