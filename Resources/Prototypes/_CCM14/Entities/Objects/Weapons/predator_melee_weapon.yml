- type: entity
  parent: [ BaseItem, RMCBaseMeleeWeapon ]
  id: CCMPredatorWeaponBase
  abstract: true
  components:
  - type: YautjaTechItem
  - type: Sprite
    sprite: _CMU14/Yautja/weapons.rsi
    state: clan_sword
  - type: Item
    sprite: _CMU14/Yautja/weapons.rsi
    size: Large
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1
    damage:
      types:
        Blunt: 12
    soundHit:
      path: /Audio/Weapons/smash.ogg
  - type: MeleeDamageMultiplier
    multiplier: 0
    whitelist:
      components:
      - Xeno
  - type: CMArmorPiercing
    amount: 0
  - type: DisarmMalus
    malus: 0.2

- type: entity
  parent: CCMPredatorWeaponBase
  id: CCMPredatorThrowingWeaponBase
  abstract: true
  components:
  - type: YautjaRecallable
    range: 12
  - type: LandAtCursor
  - type: ThrowingAngle
    angle: 225

# Light 1-hand Weapon

