- type: entity
  parent: RMCBaseEquipmentCase
  id: CCMShotgunSpecEquipmentCase
  name: heavy shotgunner equipment case
  description: "A large case containing a heavy caliber breech shotgun, a heavy armor, and additional pieces of equipment./n/nNOTE: You cannot put items back inside this case."
  components:
  - type: Sprite
    sprite: _RMC14/Objects/loadout_kits.rsi
    layers:
    - state: closed
      map: [ base ]
    - state: sniper
      map: [ label ]
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,15,3
  - type: StorageFill
    contents:
    - id: CCArmorM04KSpec
    - id: CCMArmorHelmetM03K # TODO RMC14 Give hearing protection component if ear damage is added. Hearing protection should prevent backblast stun, damage, and deafness effects.
    - id: CCMM44KSatchel
    - id: CCMWeaponM404K
    - id: CCMShellM404KShock
      amount: 1
    - id: CCMShellM404KFrag
      amount: 2
    - id: CCMShellM404KDragonFlame
      amount: 1
    - id: CCMShellM404KDragonEye
      amount: 1
    - id: CCMShellM404KDragonClaw
      amount: 1
    - id: CCMShellM404KBlackRocket
      amount: 1
    - id: RMCMK80
    - id: CMMagazinePistolMK80
      amount: 1
    - id: RMCExplosiveBreachingCharge
      amount: 2
    - id: CCMAttachmentExtendedM404Barrel
    - id: CCMAttachmentLightM404Barrel
    - id: CCMAttachmentLongM404Barrel
  - type: CMChangeUserOnVend
    addComponents:
    - type: DemoSpecWhitelist
  - type: IgnoreContentsSize
    items:
      tags:
      - CCMWeaponM404K

