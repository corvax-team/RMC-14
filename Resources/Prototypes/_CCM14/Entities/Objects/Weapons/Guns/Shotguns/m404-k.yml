- type: entity
  parent: [ RMCBaseBreechloader, RMCBaseAttachableHolder ]
  name: M404-Kongat
  id: CCMWeaponM404K
  description: A limited breech shotgun like gun, that used for heavy shotgun handfuls. It full name is MODEL 404 KONGAT
  components:
  - type: Sprite
    sprite: _CCM14/Objects/Weapons/Guns/Shotguns/m404k.rsi
  - type: Clothing
    sprite: _CCM14/Objects/Weapons/Guns/Shotguns/m404k.rsi
  - type: Tag
    tags:
    - CCMWeaponM404K
    - RMCWeaponShotgun
  - type: Gun
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_mou53.ogg
    shotsPerBurst: 1
  - type: Appearance
  - type: ShootUseDelay
  - type: GunRequiresWield
  - type: GunRequireEquipped
    whitelist:
      components:
      - SmartGunArmor # Im lazy as f
  - type: RMCMagneticItem
  - type: GunDamageModifier
    multiplier: 1.35
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    recoilWielded: 2
    recoilUnwielded: 4
    scatterWielded: 9
    scatterUnwielded: 18
    baseFireRate: 4
    burstScatterMult: 1
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1
    accuracyMultiplierUnwielded: 0.5
  - type: BallisticAmmoProvider
    cycleable: true
    whitelist:
      tags:
      - RMCShellShotgunSlugs
      - RMCShellShotgunIncendiary
      - RMCShellShotgunBeanbag
      - RMCShellShotgunFlechette
      - CCMM404KShell
    proto: CMShellShotgunFlechette
    capacity: 1
    soundInsert:
      path: /Audio/_RMC14/Weapons/Guns/Reload/gun_mou_reload.ogg
  - type: RMCAmmoEject
    containerID: ballistic-ammo
    ejectSound:
      path: /Audio/_RMC14/Weapons/Guns/Reload/gun_mou_reload.ogg
  - type: UseDelay
  - type: BreechLoaded
    openSound:
      path: /Audio/_RMC14/Weapons/Guns/Breech/pkd_open_chamber.ogg
    closeSound:
      path: /Audio/_RMC14/Weapons/Guns/Breech/pkd_close_chamber.ogg
    toggleDelay: 1.1
  - type: GunUserWhitelist
    whitelist:
      components:
      - DemoSpecWhitelist
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - CCMAttachmentExtendedM404Barrel
          - CCMAttachmentLightM404Barrel
          - CCMAttachmentLongM404Barrel
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentGyroscopicStabilizer
          - RMCAttachmentFlashlightGrip
          - RMCAttachmentAngledGrip
          - RMCAttachmentVerticalGrip
          - RMCAttachmentLaserSight
      rmc-aslot-stock:
        locked: true
        startingAttachable: RMCAttachmentM42A2CollapsibleStock
        whitelist:
          tags:
          - RMCAttachmentM42A2CollapsibleStock
  - type: ItemCamouflage
    camouflageVariations:
      Jungle: _CCM14/Objects/Weapons/Guns/Shotguns/m404k_camo/m404k_jungle.rsi
      Desert: _CCM14/Objects/Weapons/Guns/Shotguns/m404k_camo/m404k_desert.rsi
      Snow: _CCM14/Objects/Weapons/Guns/Shotguns/m404k_camo/m404k_snow.rsi
      Classic: _CCM14/Objects/Weapons/Guns/Shotguns/m404k.rsi
      Urban: _CCM14/Objects/Weapons/Guns/Shotguns/m404k_camo/m404k_urban.rsi
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-underbarrel: 0.5, -0.25

# Barrels

- type: entity
  parent: RMCBarrelAttachmentBase
  id: CCMAttachmentLightM404Barrel
  name: M404-K light weight barrel
  description: The lighter barrel gives more handling speed and movement speed, decreases accuracy and bullet velocity.
  components:
  - type: Sprite
    state: u_m10_overcomp
  - type: Tag
    tags:
    - RMCAttachmentBarrel
    - CCMAttachmentLightM404Barrel
  - type: AttachableVisuals
  - type: AttachableWeaponRangedMods
    modifiers:
    - conditions:
        wieldedOnly: false
      accuracyAddMult: -0.2
    - projectileSpeedFlat: -10
  - type: AttachableSpeedMods
    modifiers:
    - conditions:
        wieldedOnly: false
      walk: 0.059
      sprint: 0.101
  - type: AttachableWieldDelayMods
    modifiers:
    - delay: -0.4

- type: entity
  parent: RMCBarrelAttachmentBase
  id: CCMAttachmentExtendedM404Barrel
  name: M404-K extended barrel
  description: Extended M404-K barrel gives more accuracy and bullet velocity, however, it decreases handling.
  components:
  - type: Sprite
    state: suppressor_sleek
  - type: Tag
    tags:
    - RMCAttachmentBarrel
    - CCMAttachmentExtendedM404Barrel
  - type: AttachableVisuals
  - type: AttachableWeaponRangedMods
    modifiers:
    - conditions:
        wieldedOnly: false
      accuracyAddMult: 0.3
    - projectileSpeedFlat: 15
  - type: AttachableWieldDelayMods
    modifiers:
    - delay: 0.4
  - type: AttachableWeaponMeleeMods
    modifiers:
    - bonusDamage:
        types:
          Blunt: 20

- type: entity
  parent: RMCBarrelAttachmentBase
  id: CCMAttachmentLongM404Barrel
  name: M404-K long barrel
  description: A long version barrel that gives more damage and decreases fallof, also giving more accuracy. However, long barrel reduces movement speed and handling.
  components:
  - type: Sprite
    state: u_ebarrel_vented
  - type: Tag
    tags:
    - RMCAttachmentBarrel
    - CCMAttachmentLongM404Barrel
  - type: AttachableVisuals
  - type: AttachableWeaponRangedMods
    modifiers:
    - accuracyAddMult: 0.5
      projectileSpeedFlat: 10
      damageFalloffAddMult: -0.1
      damageAddMult: 0.1
      recoilFlat: -1
    - conditions:
        unwieldedOnly: true
      recoilFlat: 1
      accuracyAddMult: -0.3
  - type: AttachableWieldDelayMods
    modifiers:
    - delay: 0.8
  - type: AttachableSpeedMods
    modifiers:
    - conditions:
        wieldedOnly: false
      walk: -0.059
      sprint: -0.101

