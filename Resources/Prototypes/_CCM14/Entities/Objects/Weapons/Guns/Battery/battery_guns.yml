- type: entity
  name: borg laser module
  parent: WeaponLaserCarbinePractice
  id: CCMWeaponLaserModule
  description: Favoured by Nanotrasen Security for being cheap and easy to use.
  components:
  - type: Sprite
    sprite: _CCM14/Objects/Weapons/Guns/Battery/laser_module.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance
  - type: GunToggleableRecoil
  - type: Gun
    selectedMode: FullAuto
    scatterUnwielded: 0
    recoilUnwielded: 0
    fireRate: 2.5
    burstScatterMult: 0
    modifiers:
      FullAuto:
        fireDelay: 0
        maxScatterModifier: 0
        useBurstScatterMult: false
    availableModes:
      - SemiAuto
      - FullAuto
  - type: HitscanBatteryAmmoProvider
    proto: CCMRedLaser
    fireCost: 10
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 10
  - type: Battery
    maxCharge: 400
    startingCharge: 400

- type: hitscan
  id: CCMRedLaser
  damage:
    types:
      Heat: 25
  muzzleFlash:
    sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
    state: muzzle_laser
  travelFlash:
    sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
    state: beam
  impactFlash:
    sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
    state: impact_laser