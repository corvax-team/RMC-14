- type: entity
  parent: [ CMBaseWeaponRifle, RMCBaseWeaponMagazineVisuals ]
  id: CCMWeaponSonicCarbine
  name: acoustic carbine
  description: A modular weapon built to suppress biological threats. Fires high-frequency directed sound pulses that shatter a xenomorph's inner ear and carapace, slowing it and cutting it off from the hive.
  components:
  - type: Sprite
    sprite: _CCM14/Objects/Silencer/sonic_carbine.rsi
    layers:
    - state: icon
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _CCM14/Objects/Silencer/sonic_carbine.rsi
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      path: /Audio/Effects/radpulse5.ogg
      params:
        volume: 2
        pitch: 1.4
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - FullAuto
    recoilUnwielded: 4
    scatterWielded: 6
    scatterUnwielded: 20
    baseFireRate: 2.5
    burstScatterMult: 1
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.2
    accuracyMultiplierUnwielded: 0.65
  - type: GunUserWhitelist
    whitelist:
      components:
      - CCMSilencerWhitelist
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - CCMMagazineRifleSonic
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentSuppressor
          - RMCM5Bayonet
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - CCMAttachmentSonicPulse
          - RMCAttachmentAngledGrip
          - RMCAttachmentVerticalGrip
          - RMCAttachmentFlashlightGrip
          - RMCAttachmentLaserSight
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.8425, 0.001
      rmc-aslot-rail: 0.1, 0.16
      rmc-aslot-underbarrel: 0, 0
  - type: Tag
    tags:
    - CCMWeaponSonicCarbine

- type: entity
  parent: CCMWeaponSonicCarbine
  id: CCMWeaponSonicCarbineFilled
  suffix: Filled
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: CCMMagazineRifleSonic
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - CCMMagazineRifleSonic

- type: entity
  parent: CMMagazineRifleBase
  id: CCMMagazineRifleSonic
  name: acoustic carbine magazine
  description: A 30-round magazine of resonator cartridges for the acoustic carbine.
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - CCMMagazineRifleSonic
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - CCMCartridgeSonic
    proto: CCMCartridgeSonic
    capacity: 30
  - type: Sprite
    sprite: _CCM14/Objects/Silencer/sonic_magazine.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Appearance

- type: entity
  parent: CMBaseCartridgeRifle
  id: CCMCartridgeSonic
  name: resonator cartridge
  description: A cartridge that converts its charge into a directed high-frequency sound pulse. Fits acoustic carbine magazines.
  components:
  - type: Tag
    tags:
    - Cartridge
    - CCMCartridgeSonic
  - type: CartridgeAmmo
    proto: CCMBulletSonic
    muzzleFlash: CCMSonicMuzzleFlash

- type: entity
  parent: RMCBaseBullet
  id: CCMBulletSonic
  name: sonic pulse
  categories: [ HideSpawnMenu ]
  components:
  # Transparent: drawn by CCMSonicCarbineOverlay. Sprite is kept for RMC prediction visibility.
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/bullet_projectiles.rsi
    layers:
    - state: bullet
      shader: unshaded
      color: "#ffffff00"
  - type: CCMSonicBulletVisuals
  - type: Projectile
    impactEffect: CCMSonicImpactEffect
    damage:
      types:
        Piercing: 40
  - type: CMArmorPiercing
    amount: 30
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 22
      falloff: 9999
      ignoreModifiers: true
    - range: 7
      falloff: 4
  - type: RMCProjectileAccuracy
    accuracy: 105
    thresholds:
    - range: 16
      falloff: 10
  - type: CCMSonicRound
    slowPerStackSmall: 0.10
    slowPerStackLarge: 0.05
    maxStacks: 3
    stackDuration: 5
    hiveDisruptDuration: 5

# No Sprite on purpose: client ProjectileSystem requires an EffectLayers.Unshaded layer if one exists.
- type: entity
  id: CCMSonicImpactEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.5
  - type: CCMSonicImpactEffect
    duration: 0.5

- type: entity
  parent: MuzzleFlashEffect
  id: CCMSonicMuzzleFlash
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.3
  - type: Sprite
    drawdepth: BelowMobs
    offset: 0.33, 0
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: _RMC14/Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_bullet_high_RMC
      color: "#ffffff00"
  - type: CCMSonicMuzzleFlash
    duration: 0.3
    muzzleOffset: 0.33

- type: Tag
  id: CCMWeaponSonicCarbine

- type: Tag
  id: CCMMagazineRifleSonic

- type: Tag
  id: CCMCartridgeSonic
